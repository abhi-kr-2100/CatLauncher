[package]
name = "cat-launcher"
version = "0.15.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

[lib]
name = "cat_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cat-macros = { path = "../cat-macros" }
strum = { version = "0.28.0", features = ["derive"] }
tauri = { version = "2.11.0", features = ["devtools", "protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
reqwest = { version = "0.13.3", features = ["json"] }
ts-rs = "12.0.1"
chrono = { version = "0.4.44", features = ["serde"] }
downloader = { git = "https://github.com/abhi-kr-2100/downloader.git", rev = "db3d764b6677a1ca4a685b21f0fff10734a4e2e2" }
zip = "8.6.0"
tokio = { version = "1.52.1", features = ["rt-multi-thread", "process", "macros"] }
tar = "0.4.45"
flate2 = "1.1.9"
sha2 = "0.11.0"
regex = "1.12.3"
dmg = "0.1.2"
unrar = "0.5.8"
async-trait = "0.1.89"
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2 = "0.8.10"
r2d2_sqlite = "0.33.0"
uuid = { version = "1.23.1", features = ["v4"] }
posthog-rs = "0.6.0"
url = "2.5.8"
urlencoding = "2.1.3"
ttf-parser = "0.25.1"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.23.0"
github-mock-api = { git = "https://github.com/abhi-kr-2100/github-mock-api.git", rev = "68bbeca7b0e4035ced327e840f8a118d5a31aedf" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.10.1"
