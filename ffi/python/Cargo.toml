[package]
name = "github-mock-api-python"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "github_mock_api_python"
doctest = false

[dependencies]
github-mock-api = { path = "../../" }
github-mock-api-ffi-common = { path = "../common" }
pyo3 = { version = "0.28", default-features = false, features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
pyo3 = { version = "0.28.3", default-features = false, features = ["auto-initialize", "macros"] }
